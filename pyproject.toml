[project]
name = "haroframe"
version = "0.1.0"
description = "Image-to-video generation system with identity (face/body) preservation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "python-dotenv>=1.2,<2",
    "numpy>=1.26,<3",
    "pillow>=10.4,<13",
    "opencv-python>=4.10,<6",
    "torch>=2.4",
    "diffusers>=0.31",
    "transformers>=4.45",
    "accelerate>=0.34",
    "safetensors>=0.4.5,<1",
    "huggingface_hub>=0.25",
    "insightface>=0.7.3,<2",
    "controlnet_aux>=0.0.9",
    "einops>=0.8,<1",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu>=1.19"]
cpu = ["onnxruntime>=1.19"]
# basicsr's sdist build is currently broken on Python 3.13 (setup.py version
# parsing bug: KeyError '__version__') and it ships no wheel on PyPI.
# gfpgan_restorer.py must guard its basicsr/facexlib imports and raise a
# clear ModelLoadError until this is patched or a fixed fork is available.
restoration = ["gfpgan>=1.3.8", "basicsr>=1.4.2", "facexlib>=0.3.0"]
# Meta doesn't publish an official PyPI wheel for segment-anything under this
# import name, so this pins a direct git reference (PEP 508). Opt-in, not part
# of the default gpu extra -- SAM checkpoints are large (375MB-2.6GB) and must
# be downloaded separately regardless of pip install. See garment_swap_renderer.py.
garment = ["segment-anything @ git+https://github.com/facebookresearch/segment-anything.git"]
dev = ["pytest>=8.3,<9", "pytest-mock>=3.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
